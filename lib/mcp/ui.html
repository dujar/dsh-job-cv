      /* the master CV tab: the source of truth, its diff against this
         application, and the rendered documents side by side */
      function rMaster(v) {
        const d = state.doc;
        if (!d || !d.workspace) {
          v.innerHTML = '<div class="empty">No candidacy open yet.<br><span class="sub">Ask your assistant to open one against a job post.</span></div>';
          return;
        }
        if (!d.masterVersion || !state.master) {
          const e = el('div', 'empty');
          e.innerHTML = 'No master CV yet.<br><span class="sub">The master is your full, untailored CV — every application is tailored from it. ' +
            'Ask your assistant to set one up from any CV you have (POST /jobcv/master), and this tab shows it beside each tailored CV.</span>';
          v.appendChild(e);
          return;
        }

        const dl = state.masterDelta;
        const syncable = dl && !dl.empty && (dl.changes || []).length > 0;
        const out = state.masterDeltaOut;
        const outReady = out && !out.empty && (out.changes || []).length > 0;

        // ---- toolbar: print, open raw, and the side-by-side toggle ----
        const bar = el('div', 'toolbar');
        const pr = el('button', 'act primary', '⎙ Print / Save PDF');
        pr.title = 'Opens the master CV at A4 and shows the print / Save-as-PDF dialog';
        pr.onclick = () => printDoc('master');
        bar.appendChild(pr);
        const open = el('button', 'act', 'Open master in tab');
        open.onclick = () => openRaw('master');
        bar.appendChild(open);
        if (d.html) {
          const tg = el('button', 'act' + (state.masterSxs ? ' primary' : ''), state.masterSxs ? 'Side by side ✓' : 'Side by side');
          tg.onclick = () => {
            state.masterSxs = !state.masterSxs;
            try { localStorage.setItem('jobcv-master-sxs', state.masterSxs ? '1' : '0'); } catch (e) {}
            render();
          };
          bar.appendChild(tg);
        }
        bar.appendChild(el('span', 'sub', 'master v' + d.masterVersion + (state.master.note ? ' · ' + state.master.note : '')));
        v.appendChild(bar);

        // ---- the two directions, one at a time: what the master gained
        //      since this CV was reconciled (sync down), and what tailoring
        //      changed (fold back). Each renders as a git-style diff. ----
        const segwrap = el('div', 'segwrap');
        const seg = el('div', 'seg');
        const mkSeg = (key, label, badge) => {
          const b = el('button', 'seg-b' + (state.masterView === key ? ' on' : ''),
            label + (badge ? ' <span class="seg-n">' + badge + '</span>' : ''));
          b.type = 'button';
          b.onclick = () => {
            if (state.masterView === key) return;
            state.masterView = key;
            try { localStorage.setItem('jobcv-master-view', key); } catch (e) {}
            render();
          };
          return b;
        };
        seg.appendChild(mkSeg('sync', 'Master gained', dl && !dl.empty ? '<span class="pm-a">+' + dl.added + '</span> <span class="pm-d">−' + dl.removed + '</span>' : ''));
        seg.appendChild(mkSeg('tailor', 'Tailoring changes', outReady ? '<span class="pm-a">+' + out.added + '</span> <span class="pm-d">−' + out.removed + '</span>' : ''));
        segwrap.appendChild(seg);
        v.appendChild(segwrap);

        if (state.masterView === 'tailor' && d.html) v.appendChild(outgoingDeltaCard(out));
        else v.appendChild(masterSyncCard(dl, syncable));

        // ---- the documents ----
        if (state.masterSxs && d.html) {
          const sxs = el('div', 'sxs');
          const mfig = el('figure');
          mfig.appendChild(el('figcaption', null, 'Master CV · v' + d.masterVersion));
          const mfr = el('div', 'doc-frame'); mfr.appendChild(frame(state.master.html)); mfig.appendChild(mfr);
          const cfig = el('figure');
          cfig.appendChild(el('figcaption', null, esc((d.company || 'This job') + ' · CV v' + d.version)));
          const cfr = el('div', 'doc-frame'); cfr.appendChild(frame(d.html)); cfig.appendChild(cfr);
          sxs.appendChild(mfig); sxs.appendChild(cfig);
          v.appendChild(sxs);
        } else {
          const w = el('div', 'doc-frame');
          w.appendChild(frame(state.master.html));
          v.appendChild(w);
        }

        const rp = requestsPanel();
        if (rp) v.appendChild(rp);
      }

      function masterSyncCard(dl, syncable) {
        const c = el('div', 'card dcard');
        const d = state.doc;
        if (!dl || dl.empty === 'no-master') {
          c.appendChild(el('div', 'sub', 'No master CV to compare against yet.'));
          return c;
        }
        if (dl.empty === 'no-document') {
          c.appendChild(el('div', 'sub', 'Tailor a CV for this job first — then this shows what the master would add to it.'));
          return c;
        }
        if (dl.empty === 'in-sync') {
          c.appendChild(el('div', 'd-insync', '<span class="oktick">✓</span> This CV is level with your master CV (v' + dl.masterVersion + '). Nothing to pull in.'));
          return c;
        }
        const base = dl.baseMasterVersion;
        const head = el('div', 'dc-head');
        head.innerHTML = '<span class="dc-file">master <span class="mut">v' + base + '</span><span class="arrow">→</span>v' + dl.masterVersion + '</span>' +
          diffStatsBadge(dl.added, dl.removed);
        c.appendChild(head);
        c.appendChild(el('div', 'dc-cap', 'What the master gained since CV v' + d.version + ' was tailored' +
          (dl.baseInferred ? ' — this CV predates sync tracking, so everything since the oldest master kept (v' + base + ') shows' : '') +
          '. Syncing pulls in only what fits this post.'));

        const baseHtml = ensureBaseMaster(base);
        if (baseHtml !== null && state.master && state.master.html) {
          c.appendChild(renderDiff(cachedDiff('sync:' + base + '>' + dl.masterVersion, baseHtml, state.master.html)));
        } else {
          c.appendChild(compactChanges(dl.changes || []));
        }

        if (syncable) {
          const foot = el('div', 'dc-foot');
          const b = el('button', 'act primary', 'Ask the assistant to sync these into this CV');
          b.onclick = () => raise('sync-master',
            'Sync the latest master CV improvements into this tailored CV',
            { note: dl.added + ' block(s) added in the master since v' + base + '; reconcile CV v' + d.version + ' against master v' + dl.masterVersion });
          foot.appendChild(b);
          foot.appendChild(el('div', 'sub', 'The assistant proposes only the parts that fit this job post — you decide each in Review.'));
          c.appendChild(foot);
        }
        return c;
      }

      /* the outgoing delta: master@HEAD is BEFORE, this tailored CV AFTER —
         additions live only in this CV (fold-back candidates), removals are
         what tailoring left out */
      function outgoingDeltaCard(dl) {
        const c = el('div', 'card dcard');
        const d = state.doc;
        if (!dl || dl.empty === 'no-master') {
          c.appendChild(el('div', 'sub', 'No master CV to compare against yet.'));
          return c;
        }
        if (dl.empty === 'no-document') {
          c.appendChild(el('div', 'sub', 'No tailored CV for this job yet.'));
          return c;
        }
        const diff = cachedDiff('out:' + dl.masterVersion + '>' + d.version, state.master.html, d.html);
        if (!diff.added && !diff.removed) {
          c.appendChild(el('div', 'd-insync', '<span class="oktick">✓</span> This CV is identical to the master (v' + dl.masterVersion + ').'));
          return c;
        }
        const head = el('div', 'dc-head');
        head.innerHTML = '<span class="dc-file">master <span class="mut">v' + dl.masterVersion + '</span><span class="arrow">→</span>CV v' + d.version +
          (d.company ? ' <span class="mut">· ' + esc(d.company) + '</span>' : '') + '</span>' +
          diffStatsBadge(diff.added, diff.removed);
        c.appendChild(head);
        c.appendChild(el('div', 'dc-cap', 'What tailoring changed. <b>Green</b> lines are in this CV and not the master — ask the assistant to fold the good ones back in. <b>Red</b> lines were left out.'));
        c.appendChild(renderDiff(diff));
        return c;
      }

      function rPost(v) {
        const p = state.post;
        if (!p || (!p.text && !p.html)) {
          const e = el('div', 'empty');
          e.innerHTML = 'No job post stored yet.';
          const b = el('button', 'act primary', 'Ask the assistant to fetch it');
          b.onclick = () => raise('fetch-post', 'Fetch and store the job post');
          e.appendChild(b);
          v.appendChild(e);
          return;
        }
        if (p.html) {
          const w = el('div', 'doc-frame');
          w.appendChild(frame(p.html));
          v.appendChild(w);
        } else {
          const c = el('div', 'card');
          c.innerHTML = '<div class="sub">source: ' + esc(p.source || 'agent') + '</div><pre class="post">' + esc(p.text) + '</pre>';
          v.appendChild(c);
        }
      }

      function rFit(v) {
        const d = state.doc;
        const f = d && d.fit;
        if (!f) {
          const e = el('div', 'empty');
          e.innerHTML = 'Not scored yet.';
          const b = el('button', 'act primary', 'Ask to score the fit');
          b.onclick = () => raise('rescore', 'Score my fit against this job post');
          e.appendChild(b);
          v.appendChild(e);
          return;
        }
        const b = fitBand(f.score);
        const head = el('div', 'card');
        head.innerHTML =
          '<div class="score band-' + b.key + '">' + f.score + '<span>/100 · ' + b.label + '</span></div>' +
          (f.verdict ? '<div class="verdict">' + esc(f.verdict) + '</div>' : '') +
          (f.decidedBy ? '<div class="kv"><b>Decided by</b> ' + esc(String(f.decidedBy).replace('-', ' ')) + '</div>' : '') +
          (f.levelRead ? '<div class="kv"><b>Level</b> ' + esc(f.levelRead.supports || '?') + ' evidenced, ' + esc(f.levelRead.targets || '?') + ' targeted' + (f.levelRead.gap ? ' — ' + esc(f.levelRead.gap) : '') + '</div>' : '') +
          (fitStale(d) ? '<div class="kv" style="color:var(--major)">Scored against v' + f.basedOnVersion + ', CV is now v' + d.version + '.</div>' : '');
        const rb = el('button', 'act small', 'Ask to re-score');
        rb.style.marginTop = '10px';
        rb.onclick = () => raise('rescore', 'Re-score the fit against the current CV');
        head.appendChild(rb);
        v.appendChild(head);

        if (f.gaps && f.gaps.length) {
          const g = el('div', 'card');
          g.appendChild(el('h3', null, 'Gaps — ' + f.gaps.length));
          f.gaps.forEach((x) => {
            const row = el('div', 'gap');
            row.innerHTML =
              '<div class="tagrow"><span class="sev ' + esc(x.severity) + '">' + esc(x.severity) + '</span>' +
              (x.kind ? '<span class="kindtag">' + esc(x.kind) + '</span>' : '') + '</div>' +
              '<div class="req">' + esc(x.requirement) + '</div>' +
              (x.why ? '<div class="sub">' + esc(x.why) + '</div>' : '') +
              (x.fix ? '<div class="fix">→ ' + esc(x.fix) + '</div>' : '');
            const cb = el('button', 'act small', 'Ask to close this');
            cb.style.marginTop = '6px';
            cb.onclick = () => raise('close-gap', 'Close the gap: ' + x.requirement, { gapId: x.id || '', current: x.fix || '', need: x.requirement });
            row.appendChild(cb);
            g.appendChild(row);
          });
          v.appendChild(g);
        }
        if (f.strengths && f.strengths.length) {
          const s = el('div', 'card');
          s.appendChild(el('h3', null, 'What already lands — ' + f.strengths.length));
          f.strengths.forEach((x) => {
            s.appendChild(el('div', 'strength',
              '<div class="tagrow">' + (x.strength ? '<span class="kindtag">' + esc(x.strength) + '</span>' : '') +
              '<span class="req">' + esc(x.requirement) + '</span></div>' +
              (x.evidence ? '<div class="sub">' + esc(x.evidence) + '</div>' : '')));
          });
          v.appendChild(s);
        }
        const rp = requestsPanel();
        if (rp) v.appendChild(rp);
      }

      function rReview(v) {
        const p = state.doc && state.doc.proposal;
        if (!p) {
          v.innerHTML = '<div class="empty">No pending change proposal.<br><span class="sub">When the assistant proposes wording, decide it here.</span></div>';
          return;
        }
        const c = el('div', 'card');
        c.appendChild(el('h3', null, 'Proposed changes'));
        if (p.summary) c.appendChild(el('div', 'sub', esc(p.summary)));
        (p.changes || []).forEach((ch) => {
          const id = ch.id || ch.section;
          const box = el('div', 'gap');
          box.innerHTML = '<div class="req">' + esc(ch.section) + '</div>' +
            (ch.why ? '<div class="sub">' + esc(ch.why) + '</div>' : '') +
            '<div class="sub" style="margin:4px 0"><b>now:</b> ' + esc(ch.current) + '</div>';
          (ch.options || []).forEach((o) => {
            const opt = el('div', 'opt' + (state.picks[id] === o.id ? ' picked' : ''),
              '<div class="label">' + esc(o.label) + '</div><div>' + esc(o.text) + '</div>');
            opt.onclick = () => { state.picks[id] = o.id; render(); };
            box.appendChild(opt);
          });
          const sk = el('div', 'opt' + (state.picks[id] === 'skip' ? ' picked' : ''), '<div class="label">Skip — keep current</div>');
          sk.onclick = () => { state.picks[id] = 'skip'; render(); };
          box.appendChild(sk);
          c.appendChild(box);
        });
        const relay = 'Apply proposal ' + (p.id || '') + ':\n' + (p.changes || []).map((ch) => {
          const id = ch.id || ch.section;
          const pk = state.picks[id];
          if (!pk) return '  ' + id + ': (not decided)';
          if (pk === 'skip') return '  ' + id + ': SKIP';
          const o = (ch.options || []).find((x) => x.id === pk);
          return '  ' + id + ': use "' + (o ? o.label : pk) + '"';
        }).join('\n');
        c.appendChild(el('div', 'relay', esc(relay)));
        const bar = el('div', 'toolbar');
        bar.style.margin = '10px 0 0';
        const cp = el('button', 'act primary', 'Copy for the assistant');
        cp.onclick = () => navigator.clipboard && navigator.clipboard.writeText(relay);
        const dz = el('button', 'act', 'Dismiss panel');
        dz.onclick = () => post('/jobcv/proposal/decision', {});
        bar.appendChild(cp); bar.appendChild(dz);
        c.appendChild(bar);
        v.appendChild(c);
      }

      /* ----------------------------------------------------------- versions */
      async function showVersions(kind) {
        let list;
        try {
          list = await fetch('/jobcv/history' + q('&kind=' + kind)).then((r) => r.json());
        } catch (e) { return; }
        const vs = (list && list.versions) || [];
        if (!vs.length) return;
        const c = document.getElementById('view');
        c.innerHTML = '';
        const card = el('div', 'card');
        card.appendChild(el('h3', null, (kind === 'letter' ? 'Cover letter' : 'CV') + ' versions'));
        vs.forEach((ver, i) => {
          const row = el('div', 'gap');
          row.innerHTML = '<div class="req">v' + ver.version + (i === 0 ? ' · current' : '') + '</div>' +
            '<div class="sub">' + esc(ver.note || '(no note)') + ' · ' + ago(ver.updatedAt) + '</div>';
          if (i !== 0) {
            const rb = el('button', 'act small', 'Restore this');
            rb.style.marginTop = '6px';
            rb.onclick = async () => { await post('/jobcv/restore', { version: ver.version, kind }); selectTab(kind === 'letter' ? 'letter' : 'cv'); };
            row.appendChild(rb);
          }
          card.appendChild(row);
        });
        const back = el('button', 'act', '← back');
        back.onclick = () => selectTab(kind === 'letter' ? 'letter' : 'cv');
        const bar = el('div', 'toolbar'); bar.style.margin = '0 0 12px'; bar.appendChild(back);
        c.appendChild(bar);
        c.appendChild(card);
      }

      /* Open a document (cv | letter | master) in its own top-level window so
         it prints at real A4 — the in-page preview is a sandboxed iframe. With
         thenPrint, fire the browser's print / Save-as-PDF dialog once it lays
         out (the documents are self-contained, no external assets, so a short
         beat is enough). */
      function docHtmlFor(kind) {
        if (kind === 'letter') return state.letter && state.letter.html;
        if (kind === 'master') return state.master && state.master.html;
        return state.doc && state.doc.html;
      }
      function openDocWindow(kind, thenPrint) {
        const html = docHtmlFor(kind);
        if (!html) return;
        const w = window.open('', '_blank');
        if (!w) { alert('Allow pop-ups for this page to open the ' + kind + ' for printing.'); return; }
        w.document.open();
        w.document.write(html);
        w.document.close();
        if (!thenPrint) return;
        const go = () => { try { w.focus(); w.print(); } catch (e) {} };
        if (w.document.readyState === 'complete') setTimeout(go, 200);
        else w.addEventListener('load', () => setTimeout(go, 120));
      }
      window.openRaw = (kind) => openDocWindow(kind, false);
      window.printDoc = (kind) => openDocWindow(kind, true);

      /* --------------------------------------------------------------- boot */
      selectTab(state.tab);
      if (LIVE) { connect(); poll(); setInterval(poll, 3500); }
      else { pollDocOnce(); poll(); }
      // ?drawer=1 opens the applications drawer on load (demos, deep links).
      if (new URLSearchParams(location.search).get('drawer') === '1') {
        setTimeout(openDrawer, 400);
      }
    </script>
  </body>
</html>
